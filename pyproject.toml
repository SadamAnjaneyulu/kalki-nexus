[project]
name = "kalki-nexus"
version = "1.0.0"
description = "Kalki Nexus: a modular, LangGraph-orchestrated AI Operating System."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.112.0",
    "typing_extensions>=4.12.0",
    "PyGithub>=2.4.0",
    "langsmith>=0.1.100",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
mcp = ["langchain-mcp-adapters>=0.1.0"]
browser = ["playwright>=1.47.0"]
memory-postgres = ["psycopg[binary]>=3.2.0"]
memory-redis = ["redis>=5.0.0"]
memory-qdrant = ["qdrant-client>=1.11.0"]
memory-chroma = ["chromadb>=0.5.0"]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "agents", "tools", "memory", "workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
